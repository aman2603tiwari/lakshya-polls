name: Send Daily PW Polls

on:
  schedule:
    # 1:00 PM IST = 7:30 AM UTC
    - cron: '30 7 * * 1-5'   # Monday to Friday only
  workflow_dispatch:

jobs:
  send-polls:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests groq

      - name: Run poll script
        env:
          PW_TOKEN:      ${{ secrets.PW_TOKEN }}
          ALERT_EMAIL:   ${{ secrets.ALERT_EMAIL }}
          GMAIL_APP_PWD: ${{ secrets.GMAIL_APP_PWD }}
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
        run: python send_polls.py