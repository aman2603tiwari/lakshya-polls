name: Lakshya JEE 2027 — Daily Automation

on:
  schedule:
    - cron: '30 2 * * *'     # 8:00 AM IST  → motivation (every day)
    - cron: '30 7 * * 1-5'   # 1:00 PM IST  → quiz (Mon-Fri)
    - cron: '30 11 * * *'    # 5:00 PM IST  → checkin (every day)
    - cron: '30 16 * * 1-5'  # 10:00 PM IST → solutions (Mon-Fri)

  workflow_dispatch:
    inputs:
      mode:
        description: 'Which mode to run manually'
        required: true
        default: 'motivation'
        type: choice
        options:
          - motivation
          - quiz
          - checkin
          - solution

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install groq requests pillow

      # Detect mode from the SCHEDULE EXPRESSION that triggered — not the clock.
      # This is reliable even when GitHub Actions runs late.
      - name: Detect run mode
        id: detect_mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
            echo "Manually triggered: ${{ github.event.inputs.mode }}"
          else
            SCHEDULE="${{ github.event.schedule }}"
            echo "Triggered by schedule: $SCHEDULE"

            case "$SCHEDULE" in
              "30 2 * * *")
                echo "MODE=motivation" >> $GITHUB_ENV
                echo "Detected: motivation (8 AM IST)"
                ;;
              "30 7 * * 1-5")
                echo "MODE=quiz" >> $GITHUB_ENV
                echo "Detected: quiz (1 PM IST)"
                ;;
              "30 11 * * *")
                echo "MODE=checkin" >> $GITHUB_ENV
                echo "Detected: checkin (5 PM IST)"
                ;;
              "30 16 * * 1-5")
                echo "MODE=solution" >> $GITHUB_ENV
                echo "Detected: solution (10 PM IST)"
                ;;
              *)
                echo "MODE=motivation" >> $GITHUB_ENV
                echo "Unknown schedule '$SCHEDULE' — defaulting to motivation"
                ;;
            esac
          fi

      - name: Run automation
        env:
          PW_TOKEN:      ${{ secrets.PW_TOKEN }}
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          ALERT_EMAIL:   ${{ secrets.ALERT_EMAIL }}
          GMAIL_APP_PWD: ${{ secrets.GMAIL_APP_PWD }}
        run: |
          echo "Running in mode: $MODE"
          python send_polls.py --mode=$MODE

      - name: Commit updated state files
        if: env.MODE == 'quiz'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add todays_questions.json history.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update state files [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      - name: Upload motivation image as artifact
        if: env.MODE == 'motivation' && always()
        uses: actions/upload-artifact@v4
        with:
          name: motivation-image-${{ github.run_id }}
          path: todays_motivation.jpg
          if-no-files-found: ignore
          retention-days: 7