name: Lakshya JEE 2027 — Daily Automation

on:
  schedule:
    - cron: '30 2 * * *'        # 8:00 AM IST  → motivation
    - cron: '30 7 * * 1-5'      # 1:00 PM IST  → quiz
    - cron: '30 9 * * 1,3,5'    # 3:00 PM IST  → college
    - cron: '30 11 * * *'       # 5:00 PM IST  → checkin
    - cron: '30 16 * * 1-5'     # 10:00 PM IST → solution

  workflow_dispatch:
    inputs:
      mode:
        description: 'Which mode to run manually'
        required: true
        default: 'motivation'
        type: choice
        options:
          - motivation
          - quiz
          - college
          - checkin
          - solution

jobs:
  run:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ─────────────────────────────────────────────
      # CHECKOUT
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # PYTHON
      # ─────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ─────────────────────────────────────────────
      # DEPENDENCIES
      # ─────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests pillow google-api-python-client google-auth

      # ─────────────────────────────────────────────
      # DATE
      # ─────────────────────────────────────────────
      - name: Get today's date
        id: date
        run: |
          echo "today=$(date -u '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────
      # DETECT MODE
      # ─────────────────────────────────────────────
      - name: Detect run mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MODE: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -e

          echo "Event: $EVENT_NAME"
          echo "Schedule: $SCHEDULE"
          echo "Manual mode: $MANUAL_MODE"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$MANUAL_MODE"
          else
            case "$SCHEDULE" in
              "30 2 * * *")
                MODE="motivation"
                ;;
              "30 7 * * 1-5")
                MODE="quiz"
                ;;
              "30 9 * * 1,3,5")
                MODE="college"
                ;;
              "30 11 * * *")
                MODE="checkin"
                ;;
              "30 16 * * 1-5")
                MODE="solution"
                ;;
              *)
                echo "Unknown schedule: $SCHEDULE"
                exit 1
                ;;
            esac
          fi

          echo "Selected mode: $MODE"
          echo "MODE=$MODE" >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────
      # RESTORE QUESTIONS
      # Only required for solution mode
      # ─────────────────────────────────────────────
      - name: Restore questions cache
        if: env.MODE == 'solution'
        uses: actions/cache/restore@v4
        with:
          path: todays_questions.json
          key: questions-${{ steps.date.outputs.today }}
          fail-on-cache-miss: false

      # ─────────────────────────────────────────────
      # RUN AUTOMATION
      # ─────────────────────────────────────────────
      - name: Run automation
        env:
          PW_TOKEN: ${{ secrets.PW_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          GMAIL_APP_PWD: ${{ secrets.GMAIL_APP_PWD }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -e

          echo "======================================"
          echo "Lakshya JEE 2027 Automation"
          echo "======================================"
          echo "Running in mode: $MODE"

          if [ -f todays_questions.json ]; then
            echo "Questions file found:"
            ls -lh todays_questions.json
          else
            echo "No questions file yet"
          fi

          echo "Starting Python automation..."

          python send_polls.py --mode="$MODE"

      # ─────────────────────────────────────────────
      # SAVE QUESTIONS
      # Only after quiz mode
      # ─────────────────────────────────────────────
      - name: Save questions to cache
        if: always() && env.MODE == 'quiz'
        uses: actions/cache/save@v4
        with:
          path: todays_questions.json
          key: questions-${{ steps.date.outputs.today }}
