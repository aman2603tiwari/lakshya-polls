name: Lakshya JEE 2027 — Daily Automation

on:
  schedule:
    - cron: '30 2 * * 1-5'   # 8:00 AM IST  → motivation
    - cron: '30 7 * * 1-5'   # 1:00 PM IST  → quiz (5 polls)
    - cron: '30 16 * * 1-5'  # 10:00 PM IST → solutions

  workflow_dispatch:
    inputs:
      mode:
        description: 'Which mode to run manually'
        required: true
        default: 'quiz'
        type: choice
        options:
          - motivation
          - quiz
          - solution

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup Python ───────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install groq requests pillow

      # ── 4. Detect mode (auto from schedule OR manual from dispatch) ───────
      - name: Detect run mode
        id: detect_mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger — use the selected mode
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
            echo "Manually triggered: ${{ github.event.inputs.mode }}"
          else
            # Scheduled — detect by current UTC hour
            HOUR=$(date -u +%H)
            MINUTE=$(date -u +%M)
            echo "Current UTC time: ${HOUR}:${MINUTE}"

            if [ "$HOUR" = "02" ]; then
              echo "MODE=motivation" >> $GITHUB_ENV
              echo "Detected: motivation (8 AM IST)"
            elif [ "$HOUR" = "07" ]; then
              echo "MODE=quiz" >> $GITHUB_ENV
              echo "Detected: quiz (1 PM IST)"
            elif [ "$HOUR" = "16" ]; then
              echo "MODE=solution" >> $GITHUB_ENV
              echo "Detected: solution (10 PM IST)"
            else
              echo "MODE=quiz" >> $GITHUB_ENV
              echo "Unknown hour $HOUR — defaulting to quiz"
            fi
          fi

      # ── 5. Run the script ─────────────────────────────────────────────────
      - name: Run automation
        env:
          PW_TOKEN:      ${{ secrets.PW_TOKEN }}
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          ALERT_EMAIL:   ${{ secrets.ALERT_EMAIL }}
          GMAIL_APP_PWD: ${{ secrets.GMAIL_APP_PWD }}
        run: |
          echo "Running in mode: $MODE"
          python send_polls.py --mode=$MODE

      # ── 6. Save state files back to repo (quiz writes todays_questions.json)
      - name: Commit updated state files
        if: env.MODE == 'quiz'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit if files actually changed
          git add todays_questions.json history.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update state files [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi

      # ── 7. Upload motivation image as artifact (for debugging/preview) ────
      - name: Upload motivation image
        if: env.MODE == 'motivation' && always()
        uses: actions/upload-artifact@v4
        with:
          name: motivation-image-${{ github.run_id }}
          path: todays_motivation.jpg
          if-no-files-found: ignore
          retention-days: 7