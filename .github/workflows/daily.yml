name: Lakshya JEE 2027 — Daily Automation

on:
  schedule:
    - cron: '30 2 * * *'      # 8:00 AM IST  → motivation (every day)
    - cron: '30 7 * * 1-5'    # 1:00 PM IST  → quiz (Mon-Fri)
    - cron: '30 9 * * 1,3,5'  # 3:00 PM IST  → college photo (Mon-Wed-Fri)
    - cron: '30 11 * * *'     # 5:00 PM IST  → checkin (every day)
    - cron: '30 16 * * 1-5'   # 10:00 PM IST → solutions (Mon-Fri)

  workflow_dispatch:
    inputs:
      mode:
        description: 'Which mode to run manually'
        required: true
        default: 'motivation'
        type: choice
        options:
          - motivation
          - quiz
          - college
          - checkin
          - solution

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install groq requests pillow google-api-python-client google-auth

      - name: Detect run mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
          else
            SCHEDULE="${{ github.event.schedule }}"
            case "$SCHEDULE" in
              "30 2 * * *")   echo "MODE=motivation" >> $GITHUB_ENV ;;
              "30 7 * * 1-5") echo "MODE=quiz"       >> $GITHUB_ENV ;;
              "30 9 * * 1,3,5") echo "MODE=college"  >> $GITHUB_ENV ;;
              "30 11 * * *")  echo "MODE=checkin"    >> $GITHUB_ENV ;;
              "30 16 * * 1-5") echo "MODE=solution"  >> $GITHUB_ENV ;;
              *)               echo "MODE=motivation" >> $GITHUB_ENV ;;
            esac
          fi
          cat $GITHUB_ENV

      - name: Clear stale state files (quiz mode only)
        if: env.MODE == 'quiz'
        run: |
          rm -f todays_questions.json
          echo "Cleared todays_questions.json"

      - name: Run automation
        env:
          PW_TOKEN:         ${{ secrets.PW_TOKEN }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          ALERT_EMAIL:      ${{ secrets.ALERT_EMAIL }}
          GMAIL_APP_PWD:    ${{ secrets.GMAIL_APP_PWD }}
          GDRIVE_SA_JSON:   ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          echo "Running in mode: $MODE"
          python send_polls.py --mode=$MODE || true

      - name: Save state files to repo
        if: always() && (env.MODE == 'quiz' || env.MODE == 'college')
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== All json files anywhere ==="
          find . -name "*.json" 2>/dev/null
          echo "=== Git root ==="
          git rev-parse --show-toplevel

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add from git root explicitly
          GIT_ROOT=$(git rev-parse --show-toplevel)
          cd "$GIT_ROOT"

          git add -f todays_questions.json history.json sent_photos.json 2>/dev/null || true

          echo "=== Staged files ==="
          git diff --staged --name-only

          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: state files [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
            echo "✅ Pushed!"
          fi

      - name: Upload motivation image as artifact
        if: env.MODE == 'motivation' && always()
        uses: actions/upload-artifact@v4
        with:
          name: motivation-image-${{ github.run_id }}
          path: todays_motivation.jpg
          if-no-files-found: ignore
          retention-days: 7